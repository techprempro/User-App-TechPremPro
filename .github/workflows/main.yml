name: Build TechPremPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project
        id: find_project
        run: |
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs dirname)
          echo "Project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"
          gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp "${{ steps.find_project.outputs.project_dir }}"/app/build/outputs/apk/debug/*.apk artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechPremPro
          path: artifacts/*.apk
